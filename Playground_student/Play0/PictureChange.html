<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Picture</title>

    <style>
        body {
            background-color: rgb(0, 191, 255);
            margin: 0;
        }

        img {
            width: 100%;
            height: auto;
        }

        @media (min-width: 600px) {
            body {
                background-color: rgb(0, 255, 21);
            }
        }
    </style>
</head>
<body>

    <picture>
        
        
        
        
        <source media="(min-width: 400px)" srcset="img/AngryCat.jpeg">
        <source media="(min-width: 900px)" srcset="img/Zebra.png">
        
        <img src="img/AngryCat.jpeg" alt="Angry Cat">
    </picture>

</body>
</html>
