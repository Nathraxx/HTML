<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Photo Album</title>
  <link rel="stylesheet" href="layout.css" />
</head>

<body>
  <header class="site-header">
    <div class="container navbar">
      <div class="brand">
        <a href="Layout.html">My Photo Album</a>
      </div>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="Layout.html">Home</a>
        <a href="album.html" aria-current="page">Album</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">My Photo Album</h1>

    <section class="album-grid" aria-label="Photo grid">
      <article class="card">
        <img src="img/Zebra.png" alt="Zebra" />
        <div class="imagetxt">
          A zebra! Lorem ipsum dolor sit amet consectetur adipisicing elit...
        </div>
      </article>

      <article class="card">
        <img src="img/img3.png" alt="Kid with animals" />
        <div class="imagetxt">A picture of a kid with animals</div>
      </article>

      <article class="card">
        <img src="img/img5.png" alt="Kid doing homework" />
        <div class="imagetxt">A picture of a kid doing homework</div>
      </article>

      <article class="card">
        <img src="img/penguin.png" alt="Penguin" />
        <div class="imagetxt">A penguin!</div>
      </article>

      <article class="card">
        <img src="img/jupiter1.jpg" alt="Jupiter" />
        <div class="imagetxt">A picture of Jupiter</div>
      </article>

      <article class="card">
        <img src="img/jupiter4.png" alt="Jupiter 4" />
        <div class="imagetxt">A picture of Jupiter 4</div>
      </article>

      
    </section>

    <div class="back-row">
      <a class="btn" href="about.html">Go to start page</a>
      
      
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© 2026 My Album</small>
    </div>
  </footer>
</body>
</html>
